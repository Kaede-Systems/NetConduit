syntax = "proto3";

package netconduit;

enum MessageType {
    UNKNOWN      = 0;
    MESSAGE      = 1;
    RPC_REQUEST  = 2;
    RPC_RESPONSE = 3;
    RPC_ERROR    = 4;
    HEARTBEAT_PING = 5;
    HEARTBEAT_PONG = 6;
    AUTH_REQUEST = 7;
    AUTH_SUCCESS = 8;
    AUTH_FAILURE = 9;
    PAUSE        = 10;
    RESUME       = 11;
    ACK          = 12;
    NACK         = 13;
    CLOSE        = 14;
    CLOSE_ACK    = 15;
    RPC_LIST     = 16;
    STREAM_DATA  = 17;
    FILE_CHUNK   = 18;
}

message Packet {
    uint32 version        = 1;
    MessageType type      = 2;
    uint32 flags          = 3;
    uint64 correlation_id = 4;
    uint64 timestamp      = 5;
    bytes  payload        = 6;

    // Mesh routing
    string route_src = 7;
    string route_dst = 8;
    bool   is_mesh   = 9;
    bytes  checksum  = 10;

    // Ordering
    // sequence_id: monotonically increasing per (connection, stream_id).
    // Receivers use this to detect gaps and reorder out-of-order packets.
    uint64 sequence_id = 11;
    // stream_id: logical channel within a connection (0 = unordered/default).
    // Independent sequence spaces per stream allow multiplexing ordered and
    // unordered traffic on the same connection.
    uint32 stream_id   = 12;

    // Byte order marker for raw binary payloads (applies to payload content,
    // not to the frame framing itself — framing is always big-endian).
    // 0 = big-endian (default / network order)
    // 1 = little-endian
    uint32 byte_order  = 13;
}

message AuthRequestPayload {
    string password_hash    = 1;
    map<string, string> client_info = 2;
    string protocol_version = 3;
}

message AuthResponsePayload {
    bool   success            = 1;
    string session_token      = 2;
    map<string, string> server_info = 3;
    uint32 heartbeat_interval = 4;
    string reason             = 5;
}

message RPCRequestPayload {
    string method = 1;
    bytes  params = 2;
}

message RPCResponsePayload {
    bool   success = 1;
    bytes  result  = 2;
    string error   = 3;
    int32  code    = 4;
}

message MessagePayload {
    string type = 1;
    bytes  data = 2;
}

message StreamDataPayload {
    string stream    = 1;
    string stream_id = 2;
    bytes  data      = 3;
    uint64 sequence  = 4;
    uint64 timestamp = 5;
}

message FileChunkPayload {
    string transfer_id  = 1;
    uint32 chunk_index  = 2;
    bytes  data         = 3;
}

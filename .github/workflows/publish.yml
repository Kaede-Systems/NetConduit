name: Build & Publish to PyPI

# Triggers:
#   push a version tag (v4.0.0) → full build + publish
#   manual dispatch → build only (no publish unless explicitly opted in)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

# ─── netconduit-core (Rust extension via maturin) ─────────────────────────────

jobs:
  # ── Linux manylinux ──────────────────────────────────────────────────────────
  linux-core:
    name: Linux (${{ matrix.target }}) — netconduit-core
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: netconduit_core
          target: ${{ matrix.target }}
          args: --release --out ../dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # ── Linux musl ───────────────────────────────────────────────────────────────
  linux-musl-core:
    name: Linux musl (${{ matrix.target }}) — netconduit-core
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: netconduit_core
          target: ${{ matrix.target }}
          args: --release --out ../dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-musl-${{ matrix.target }}
          path: dist

  # ── Windows ───────────────────────────────────────────────────────────────────
  windows-core:
    name: Windows (${{ matrix.target }}) — netconduit-core
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x64
            python_arch: x64
          - target: x86
            python_arch: x86
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: netconduit_core
          target: ${{ matrix.target }}
          args: --release --out ../dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  # ── macOS ─────────────────────────────────────────────────────────────────────
  macos-core:
    name: macOS (${{ matrix.target }}) — netconduit-core
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: netconduit_core
          target: ${{ matrix.target }}
          args: --release --out ../dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # ── Source distribution ───────────────────────────────────────────────────────
  sdist-core:
    name: sdist — netconduit-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: netconduit_core
          command: sdist
          args: --out ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ─── netconduit (pure Python package) ────────────────────────────────────────
  pure-python:
    name: Build — netconduit (pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build --outdir dist-pure

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure-python
          path: dist-pure

  # ─── Publish ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only publish on version tags or manual dispatch with publish=true
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.publish == 'true'
    needs:
      - linux-core
      - linux-musl-core
      - windows-core
      - macos-core
      - sdist-core
      - pure-python
    permissions:
      id-token: write       # required for trusted publishing (OIDC)
      contents: write       # for release creation
      attestations: write   # for build provenance

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: all-dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la all-dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'all-dist/*'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Publish everything — uv publish accepts globs and handles duplicates gracefully
      - name: Publish to PyPI
        run: uv publish 'all-dist/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI-API-TOKEN }}
